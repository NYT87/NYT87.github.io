<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1280">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500&family=Space+Grotesk:wght@500&display=block">
<style>
:root{--bg:oklch(0.18 0.01 250);--text:oklch(0.94 0.01 80);--muted:oklch(0.77 0.015 80);--line:oklch(0.55 0.015 250 / 0.8);--faint:oklch(0.4 0.015 250 / 0.45);--brand:oklch(0.75 0.15 50);--surface:oklch(0.23 0.01 250)}
*{box-sizing:border-box;margin:0}
html,body{width:1280px;height:320px;overflow:hidden;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.accent{color:var(--brand)}
h1{font-family:"Space Grotesk",sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.brand{display:inline-flex;align-items:center;gap:12px;line-height:0}
.brand .mark{height:38px} .brand .word{height:30px}

.c{width:1280px;height:320px;padding:48px 72px 36px;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;column-gap:48px;
 background:linear-gradient(var(--line),var(--line)) 72px 28px/calc(100% - 144px) 2px no-repeat}
.top{grid-column:1/3;display:flex;gap:14px}
h1{grid-column:1;align-self:center;font-size:46px;max-width:23ch}
.side{grid-column:2;grid-row:2/4;align-self:end;display:grid;gap:10px;justify-items:end;text-align:right;padding-left:40px;border-left:1px solid var(--line)}
.side .mono{font-size:15px}
.bottom{grid-column:1;display:flex;align-items:center;gap:28px;padding-top:18px;border-top:1px solid var(--line);margin-right:-40px}

</style></head><body><div class="c">
 <p class="mono top"><span>Remote software studio</span><span class="accent">/</span><span>Product, backend &amp; infrastructure</span></p>
 <h1>Designing and engineering products that survive real&#8209;world scale.</h1>
 <div class="side">
  <p class="mono"><span class="accent">01</span> Web applications</p>
  <p class="mono"><span class="accent">02</span> Backend systems</p>
  <p class="mono"><span class="accent">03</span> Cloud infrastructure</p>
 </div>
 <div class="bottom"><span class="brand"><img class="mark" src="../../../public/assets/logo-icon.png" alt=""><img class="word" src="../../../public/assets/logo-text-white.png" alt="NYT87"></span>
  <span class="mono" style="text-transform:none;letter-spacing:.02em">nyt87.github.io</span></div>
</div></body></html>
